name: VibeCode

options:
  bundleIdPrefix: com.vibecode
  deploymentTarget:
    iOS: "17.0"

packages:
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: "2.0.0"
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.3.0"

targets:
  VibeCode:
    type: application
    platform: iOS
    sources:
      - VibeCode
    dependencies:
      - package: NIO
        product: NIO
      - package: NIOSSH
        product: NIOSSH
    info:
      path: VibeCode/Info.plist
    settings:
      DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
      PRODUCT_BUNDLE_IDENTIFIER: com.vibecode.app
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: 1
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      SWIFT_VERSION: "5.9"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor