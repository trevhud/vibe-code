name: VibeCode
options:
  bundleIdPrefix: com.vibecode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
packages:
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    from: "3.0.0"
configs:
  Debug: debug
  Release: release
schemes:
  VibeCode:
    build:
      targets:
        VibeCode: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VibeCodeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  VibeCode:
    type: application
    platform: iOS
    sources:
      - path: VibeCode
        excludes:
          - "**/*.md"
    dependencies:
      - package: ElevenLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecode.app
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Automatic
    info:
      path: VibeCode/Info.plist
      properties:
        CFBundleDisplayName: Vibe Code
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: SystemBackground
        UIBackgroundModes:
          - audio
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Vibe Code needs camera access to scan QR codes for connecting to your Mac."
        NSMicrophoneUsageDescription: "Vibe Code needs microphone access for voice commands."
        NSSpeechRecognitionUsageDescription: "Vibe Code uses speech recognition to transcribe your voice commands."
        ITSAppUsesNonExemptEncryption: false
  VibeCodeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VibeCodeTests
    dependencies:
      - target: VibeCode
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VibeCode.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VibeCode"
        BUNDLE_LOADER: "$(TEST_HOST)"
